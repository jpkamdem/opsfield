server:
  port: 3000

spring:
  application:
    name: opsfield
  datasource:
    url: jdbc:postgresql://database:5432/opsfield_db
    username: myuser
    password: mypasswd

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update